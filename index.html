<meta charset="utf-8">

<title>Развилка</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0e1116;--bg2:#141a23;--card:#1b222c;--line:#2a3442;
  --txt:#e8eef7;--dim:#8b98aa;
  --fin:#e0b34b;--per:#d96a8f;--cri:#5aa9e6;
  --ok:#4fbf7b;--bad:#e0574f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}
#app{max-width:520px;margin:0 auto;padding:10px 12px 48px;min-height:100vh}
h1{font-size:22px;margin:8px 0 10px;line-height:1.2}
h2{font-size:12px;margin:18px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
p{margin:6px 0}
.dim{color:var(--dim)}
.small{font-size:12px}
.center{text-align:center;padding-top:36px}
.logo{font-size:36px;letter-spacing:.06em;margin:0 0 6px;background:linear-gradient(120deg,#e0b34b,#d96a8f,#5aa9e6);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
button{font:inherit;border:0;border-radius:12px;padding:13px 14px;width:100%;margin:6px 0;background:var(--card);color:var(--txt);cursor:pointer;transition:transform .08s,background .18s;border:1px solid transparent}
button:active{transform:scale(.975)}
button:disabled{opacity:.38;cursor:default}
button.primary{background:linear-gradient(135deg,#3a6ea5,#2a4d75);font-weight:600;border-color:#3d6f9f}
button.danger{background:#3a1f21;border-color:#5a2c2f;color:#f0c8c6}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
button.sm{width:auto;display:inline-block;padding:8px 12px;font-size:13px;margin:0 6px 0 0}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font:inherit;margin:6px 0;outline:none}
.inp:focus{border-color:#3d6f9f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}
.set.sel{border-color:#5aa9e6;box-shadow:0 0 0 2px rgba(90,169,230,.35)}
.set .mini svg{display:block;width:100%;height:56px}
.set .sn{font-size:11.5px;padding:6px 7px;line-height:1.25;color:var(--dim)}
.set.sel .sn{color:var(--txt)}
.hdr{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.hrow b{color:var(--txt)}
.bad{color:#e08b85}
.bars{margin:8px 0}
.bar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin:4px 0}
.bar span{width:62px;flex:none}
.bar .track{flex:1;height:7px;background:#0b0f14;border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:6px;transition:width .35s}
.bar b{width:14px;text-align:right;font-size:12px}
.card{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,#5aa9e6);border-radius:12px;padding:10px;margin:8px 0;cursor:pointer;transition:.15s}
.card.sel{background:#22303f;box-shadow:0 0 0 2px var(--c,#5aa9e6)}
.card .ic{flex:none;width:26px;padding-top:2px}
.card .ic svg{width:26px;height:26px;color:var(--c,#5aa9e6)}
.card b{display:block;font-size:14px;margin-bottom:2px}
.card span{font-size:12.5px;color:var(--dim);line-height:1.35;display:block}
.actions{margin-top:10px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.who .nm{font-weight:600}
.who .sub{font-size:12px;color:var(--dim)}
.overlay{position:fixed;inset:0;background:rgba(4,7,11,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;backdrop-filter:blur(3px)}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:480px;max-height:84vh;overflow:auto}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.qt{font-size:13.5px;font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{width:auto;padding:8px 11px;font-size:12.5px;background:#0f151d;border:1px solid var(--line);border-radius:20px;margin:0}
.opt.on{background:#2a4d75;border-color:#5aa9e6;color:#fff}
.score{font-size:40px;font-weight:800;text-align:center;margin:10px 0;background:linear-gradient(120deg,#e0b34b,#5aa9e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.truth{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.truth svg{border-radius:50%;flex:none}
.truth b{font-size:16px}
.line{font-size:12.5px;padding:6px 9px;border-radius:9px;margin:5px 0;background:var(--card)}
.line.ok{color:#9fe0b6;border-left:3px solid var(--ok)}
.line.bad{color:#f0a5a0;border-left:3px solid var(--bad)}
.pl{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 9px;margin:6px 0;font-size:14px}
.pl svg{border-radius:50%;flex:none}
.off{color:var(--bad);font-style:normal;font-size:11px}
.code{font-size:36px;letter-spacing:.22em;text-align:center;font-weight:800;margin:6px 0 10px;color:#9fd0ff}
.qrwrap{text-align:center;margin:8px 0}
.qrbox{display:inline-block;padding:8px;background:#e8eef7;border-radius:12px;line-height:0}
.qrbox img,.qrbox canvas{display:block}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:#9fd0ff;border-radius:50%;animation:spin .9s linear infinite;margin:34px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#25313f;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88vw;text-align:center;border:1px solid #3a4a5e}
#toast.show{opacity:1;transform:translate(-50%,0)}
.gate{text-align:center;padding:50px 10px}
.gate .big{font-size:24px;font-weight:800;margin:12px 0}
.brtag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:#0f151d;border:1px solid var(--line);color:var(--dim);margin-bottom:8px}
</style>
</head>

    [/книг|долг|бухгал|выписк|страниц|счёт за|счет за/, 'book'],
    [/свидетел|показан|слух|сплетн|путан/, 'witness'],
    [/ключ|замок|взлом/, 'key'],
    [/камер|видео|наблюден/, 'eye'],
    [/телефон|звонок|смс/, 'phone'],
    [/деньг|чек|квитанц|перевод|ломбард|страхов|аренд|счёт|счет|ужин/, 'money'],

    [/чашк|чай|кофе|бокал|коньяк/, 'cup'],

  ];
  for(const [re,k] of rules) if(re.test(t)) return k;

/* ---------- 5. УТИЛИТЫ ---------- */

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sub(str,ctx){return String(str).replace(/\{(\w+)\}/g,(m,k)=>ctx[k]!==undefined?ctx[k]:m);}

let toastTimer=null;
function toast(m){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=m;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ---------- 6. ДВИЖОК ---------- */

let uidCounter=0;

function createGame(settingId, players){
  const st=SETTINGS.find(s=>s.id===settingId)||SETTINGS[0];
  const truth={s:pick(st.suspects),m:pick(st.motives),w:pick(st.methods),l:pick(st.locations)};
  const others=st.suspects.filter(x=>x!==truth.s);
  const ctx={
    S:truth.s,M:truth.m,W:truth.w,L:truth.l,
    FS:pick(others),
    FM:pick(st.motives.filter(x=>x!==truth.m)),
    FW:pick(st.methods.filter(x=>x!==truth.w)),
    FL:pick(st.locations.filter(x=>x!==truth.l)),
    N1:pick(st.suspects), N2:pick(st.suspects),
    ORG:pick(st.orgs), PLACE:pick(st.places)
  };
  const deck=shuffle(CARDS.map(c=>({
    uid:++uidCounter, title:sub(c.t,ctx), text:sub(c.x,ctx), scale:c.s, kind:c.k
  })));

  const pl=players.map((p,i)=>({id:p.id||('p'+i), name:p.name||('Игрок '+(i+1))}));
  const hands={};
  pl.forEach(p=>{hands[p.id]=deck.splice(0,3);});

  return {
    phase:'play', settingId:st.id, st,
    players:pl, hands, deck, discard:[], table:[],
    turn:0, act:1,
    need:Math.min(pl.length+2,7),
    openedThisAct:0, discards:0,
    scales:{fin:0,per:0,cri:0},
    activeBranch:null, usedBranches:[], branchFacts:{}, addedBranches:{},
    truth, ctx, last:null,
    peekFor:null, peekCard:null, peekUsed:false, criFreeUsed:false,
    actEndData:null, questions:[], answers:[], result:null
  };
}

function drawTo(S,pid){
  const h=S.hands[pid]; if(!h) return;
  while(h.length<3 && S.deck.length) h.push(S.deck.pop());
}

function nextTurn(S){
  let n=S.turn;
  for(let i=0;i<S.players.length;i++){
    n=(n+1)%S.players.length;
    if(!S.players[n].off) break;
  }
  S.turn=n;
}

function addBranchCards(S,b){
  if(S.addedBranches[b]) return;
  S.addedBranches[b]=true;
  const bf=pick(S.st.suspects);
  S.branchFacts[b]={bf};
  const ctx={BF:bf,L:S.truth.l,PLACE:S.ctx.PLACE};
  BCARDS[b].forEach(c=>{
    S.deck.push({uid:++uidCounter,title:sub(c.t,ctx),text:sub(c.x,ctx),scale:c.s,kind:'bg'});
  });
  shuffle(S.deck);
}

function endAct(S){
  const sc=S.scales;
  let dom='fin',best=-1;
  ['fin','per','cri'].forEach(k=>{ if(sc[k]>best){best=sc[k];dom=k;} });
  S.actEndData={dom, branch:dom, scores:{fin:sc.fin,per:sc.per,cri:sc.cri}};
  S.phase='actend';
}

function buildFinal(S){
  const st=S.st,t=S.truth;
  const qs=[
    {q:'Кто преступник?', opts:st.suspects, ans:st.suspects.indexOf(t.s)},
    {q:'Каков мотив?', opts:st.motives, ans:st.motives.indexOf(t.m)},
    {q:'Каков способ?', opts:st.methods, ans:st.methods.indexOf(t.w)},
    {q:'Где это произошло?', opts:st.locations, ans:st.locations.indexOf(t.l)}
  ];
  S.usedBranches.forEach(b=>{
    const f=S.branchFacts[b]; if(!f) return;
    qs.push({q:BRANCHES[b].q, opts:st.suspects, ans:st.suspects.indexOf(f.bf), branch:b});
  });
  S.questions=qs;
  S.answers=new Array(qs.length).fill(-1);
}

function computeResult(S){
  let pts=0;
  S.questions.forEach((q,i)=>{ if(S.answers[i]===q.ans) pts++; });
  const max=S.questions.length;
  let verdict;
  if(pts===max) verdict='Идеально. Дело раскрыто безупречно.';
  else if(pts===max-1) verdict='Убедительная победа — почти всё сошлось.';
  else if(pts/max>=0.66) verdict='Частично раскрыто. Кое-что упустили.';
  else verdict='Провал. Дело ушло в архив.';
  return {pts,max,verdict,lost:false};
}

function applyAction(S,a,pid){
  const me=S.players.find(p=>p.id===pid);
  if(!me) return {err:'Нет такого игрока'};

  if(a.type==='open'||a.type==='discard'||a.type==='peek'){
    if(S.phase!=='play') return {err:'Сейчас не ваш ход'};
    const cur=S.players[S.turn];
    if(!cur||cur.id!==pid) return {err:'Не ваш ход'};
  }

  switch(a.type){

    case 'peek':{
      if(S.activeBranch!=='fin') return {err:'Ветка «Финансы» не активна'};
      if(S.peekUsed) return {err:'В этом акте уже подсматривали'};
      if(!S.deck.length) return {err:'Колода пуста'};
      S.peekUsed=true; S.peekFor=pid; S.peekCard=S.deck[S.deck.length-1];
      return {};
    }

    case 'open':{
      const h=S.hands[pid]; if(!h||!h[a.idx]) return {err:'Карта не найдена'};
      const card=h.splice(a.idx,1)[0];
      S.table.push(card);
      S.scales[card.scale]=(S.scales[card.scale]||0)+1;
      S.openedThisAct++;
      let penalty=false;
      if(S.activeBranch==='per' && card.scale==='cri'){ penalty=true; S.discards++; }
      S.last={type:'open',card,penalty,by:me.name};
      S.peekFor=null; S.peekCard=null;
      drawTo(S,pid);
      if(S.discards>=6){ S.phase='result'; S.result={lost:true}; }
      else S.phase='reveal';
      return {};
    }

    case 'discard':{
      const h=S.hands[pid]; if(!h||!h[a.idx]) return {err:'Карта не найдена'};
      const card=h.splice(a.idx,1)[0];
      let counted=true;
      if(S.activeBranch==='cri' && !S.criFreeUsed){ S.criFreeUsed=true; counted=false; }
      if(counted) S.discards++;
      S.discard.push(card);
      S.last={type:'discard',counted,by:me.name};
      S.peekFor=null; S.peekCard=null;
      drawTo(S,pid);
      if(S.discards>=6){ S.phase='result'; S.result={lost:true}; }
      else S.phase='reveal';
      return {};
    }

    case 'next':{
      if(S.phase!=='reveal') return {err:''};
      if(S.discards>=6){ S.phase='result'; S.result={lost:true}; return {}; }
      if(S.openedThisAct>=S.need){ endAct(S); return {}; }
      nextTurn(S);
      S.phase='play'; S.last=null;
      return {};
    }

    case 'actend':{
      if(S.phase!=='actend') return {err:''};
      if(S.act>=3){ buildFinal(S); S.phase='final'; return {}; }
      const br=S.actEndData.branch;
      S.act++;
      S.activeBranch=br;
      if(!S.usedBranches.includes(br)) S.usedBranches.push(br);
      addBranchCards(S,br);
      S.scales={fin:0,per:0,cri:0};
      S.openedThisAct=0;
      S.need=Math.min(S.players.length+2,7);
      S.peekUsed=false; S.criFreeUsed=false;
      S.turn=0; S.phase='play'; S.last=null; S.actEndData=null;
      return {};
    }

    case 'answer':{
      if(S.phase!=='final') return {err:''};
      if(typeof a.q!=='number'||typeof a.v!=='number') return {err:''};
      S.answers[a.q]=a.v;
      return {};
    }

    case 'envelope':{
      if(S.phase!=='final') return {err:''};
      S.result=computeResult(S);
      S.phase='result';
      return {};
    }
  }
  return {err:'Неизвестное действие'};
}

/* ---------- 7. ПРЕДСТАВЛЕНИЕ СОСТОЯНИЯ ---------- */

function makeView(S,pid){
  if(!S) return null;
  const v={
    phase:S.phase,
    settingId:S.settingId,
    players:S.players||[],
    me:pid,
    turn:S.turn||0,
    act:S.act||1,
    need:S.need||0,
    openedThisAct:S.openedThisAct||0,
    discards:S.discards||0,
    scales:S.scales||{fin:0,per:0,cri:0},
    table:S.table||[],
    activeBranch:S.activeBranch||null,
    usedBranches:S.usedBranches||[],
    last:S.last||null,
    hand:(S.hands&&S.hands[pid])||[],
    deckCount:S.deck?S.deck.length:0,
    peekUsed:!!S.peekUsed,
    peek:(S.peekFor===pid?S.peekCard:null),
    actEndData:S.actEndData||null,
    questions:(S.questions||[]).map(q=>({q:q.q,opts:q.opts,branch:q.branch})),
    answers:S.answers||[],
    result:null,
    truth:null
  };
  if(S.phase==='result'){
    v.result=S.result||{lost:true};
    v.questions=(S.questions||[]).map(q=>({q:q.q,opts:q.opts,ans:q.ans,branch:q.branch}));
    v.answers=S.answers||[];
    v.truth=S.truth?{s:S.truth.s,m:S.truth.m,w:S.truth.w,l:S.truth.l}:null;
  }
  return v;
}

/* ---------- 8. СЕТЬ ---------- */

const NET={mode:'local',peer:null,conn:null,conns:[],code:'',view:null,joining:false};
let LS=null;

const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function randCode(){let s='';for(let i=0;i<4;i++)s+=AL[rnd(AL.length)];return s;}

function createRoom(hostName){
  NET.mode='host';
  let tries=0;
  const go=()=>{
    const code=randCode();
    let peer;
    try{ peer=new Peer('razv-'+code); }catch(e){ fail(); return; }
    peer.on('open',()=>{
      NET.peer=peer; NET.code=code; NET.conns=[];
      LS={phase:'lobby',settingId:ui.setting,players:[{id:'p0',name:hostName||'Хост'}]};
      render();
    });
    peer.on('connection',onConnection);
    peer.on('error',()=>{
      try{peer.destroy();}catch(e){}
      if(tries++<3) setTimeout(go,350);
      else fail();
    });
  };
  const fail=()=>{
    NET.mode='local'; LS=null;
    toast('Не удалось создать комнату. Проверьте интернет и попробуйте снова.');
    render();
  };
  go();
}

function onConnection(conn){
  conn.on('open',()=>{
    conn.on('data',d=>{
      if(!d||!d.t) return;
      if(d.t==='hello'){
        if(!LS||LS.phase!=='lobby'){ conn.send({t:'err',m:'Игра уже началась'}); return; }
        if(LS.players.length>=5){ conn.send({t:'err',m:'Комната заполнена (5 игроков)'}); return; }
        if(LS.players.some(p=>p.id===conn.pid)) return;
        const id='p'+LS.players.length;
        conn.pid=id;
        LS.players.push({id,name:String(d.name||'Игрок').slice(0,16)||'Игрок'});
        NET.conns.push(conn);
        broadcast();
      }
      if(d.t==='action'&&conn.pid&&LS){
        const r=applyAction(LS,d.a,conn.pid);
        if(r&&r.err) { try{conn.send({t:'err',m:r.err});}catch(e){} }
        broadcast();
      }
    });
    conn.on('close',()=>{
      if(!LS) return;
      const p=LS.players.find(x=>x.id===conn.pid);
      if(p){ p.off=true; broadcast(); }
      NET.conns=NET.conns.filter(c=>c!==conn);
    });
  });
}

function broadcast(){
  if(NET.mode!=='host'||!LS) return;
  NET.conns.forEach(c=>{
    try{ if(c.open) c.send({t:'state',v:makeView(LS,c.pid)}); }catch(e){}
  });
  render();
}

function joinRoom(code,name){
  NET.mode='guest'; NET.joining=true; NET.code=code;
  const peer=new Peer();
  peer.on('open',()=>{
    NET.peer=peer;
    let conn;
    try{ conn=peer.connect('razv-'+code,{reliable:true}); }catch(e){ toast('Ошибка соединения'); return; }
    NET.conn=conn;
    conn.on('open',()=>{ conn.send({t:'hello',name}); });
    conn.on('data',d=>{
      if(!d||!d.t) return;
      if(d.t==='state'){ NET.view=d.v; render(); }
      if(d.t==='err'){ toast(d.m); }
    });
    conn.on('error',()=>toast('Ошибка соединения'));
    conn.on('close',()=>{ NET.view=null; NET.joining=false; toast('Связь с хостом потеряна'); render(); });
  });
  peer.on('error',()=>{
    NET.mode='local'; NET.joining=false;
    toast('Не удалось подключиться. Проверьте код и сеть.');
    render();
  });
}

/* ---------- 11. РЕНДЕР ---------- */

let qrCache={url:'',node:null};

function getQR(url){
  if(qrCache.url===url&&qrCache.node) return qrCache.node;
  const box=document.createElement('div');
  box.className='qrbox';
  try{
    new QRCode(box,{text:url,width:160,height:160,colorDark:'#0e1116',colorLight:'#e8eef7',correctLevel:QRCode.CorrectLevel.M});
  }catch(e){
    box.innerHTML='<div style="color:#000;padding:10px;font-size:12px">QR недоступен</div>';
  }
  qrCache={url,node:box};
  return box;
}

function render(){
  const app=document.getElementById('app');
  if(!app) return;

  if(NET.mode==='guest'){
    if(NET.view){ app.innerHTML=screenFor(NET.view); afterRender(NET.view); }
    else if(NET.joining){ app.innerHTML=connectingScreen(); }
    else if(pendingRoom){ app.innerHTML=joinScreen(); }
    else { app.innerHTML=modeScreen(); afterRender(null); }
    return;
  }

  if(NET.mode==='host'&&LS){
    app.innerHTML=screenFor(makeView(LS,'p0'));
    afterRender(makeView(LS,'p0'));
    return;
  }

  if(!LS){
    if(ui.screen==='setup') app.innerHTML=setupScreen();
    else if(pendingRoom) app.innerHTML=joinScreen();
    else app.innerHTML=modeScreen();
    afterRender(null);
    return;
  }

  const pid=(NET.mode==='host')?'p0':(LS.players[LS.turn]?LS.players[LS.turn].id:'p0');
  const V=makeView(LS,pid);
  app.innerHTML=screenFor(V);
  afterRender(V);
}

function afterRender(V){
  const host=document.getElementById('qrhost');
  if(host&&NET.code){
    const url=location.origin+location.pathname+'?room='+NET.code;
    host.appendChild(getQR(url));
  }
  if(!V) return;
  if(sel>=V.hand.length) sel=-1;
}

function sendAction(a){
  if(NET.mode==='guest'){
    if(NET.conn&&NET.conn.open) NET.conn.send({t:'action',a});
    else toast('Нет связи с хостом');
    return;
  }
  if(NET.mode==='host'){
    const r=applyAction(LS,a,'p0');
    if(r&&r.err) toast(r.err);
    broadcast();
    return;
  }
  // local
  const pid=LS.players[LS.turn]?LS.players[LS.turn].id:'p0';
  const r=applyAction(LS,a,pid);
  if(r&&r.err) toast(r.err);
  render();
}

  o.innerHTML=`<div class="modal">${html}<button class="ghost" data-a="closeModal">Закрыть</button></div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{
    if(e.target===o||e.target.closest('[data-a="closeModal"]')) o.remove();
  });
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='myname'){
    MYNAME=t.value;
    try{localStorage.setItem('razv-name',MYNAME);}catch(err){}
  }
  if(t.matches&&t.matches('#names .inp')){
    const i=+t.dataset.i;
    if(ui.names[i]!==undefined) ui.names[i]=t.value;
  }
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el) return;
  const a=el.dataset.a;

  switch(a){

    case 'online':{
      const nm=(MYNAME||'').trim()||'Хост';
      createRoom(nm);
      break;
    }

    case 'local':{
      ui.screen='setup';
      NET.mode='local';
      render();
      break;
    }

    case 'dojoin':{
      const nm=(MYNAME||'').trim()||'Игрок';
      if(!pendingRoom){ render(); break; }
      joinRoom(pendingRoom,nm);
      render();
      break;
    }

    case 'canceljoin':{
      pendingRoom='';
      try{ history.replaceState(null,'',location.pathname); }catch(err){}
      NET.mode='local'; NET.joining=false;
      render();
      break;
    }

    case 'rules': showRules(); break;
    case 'table': { const V=viewState(); if(V) showTable(V); break; }
    case 'closeModal': { const o=el.closest('.overlay'); if(o) o.remove(); break; }

    case 'setSetting':{
      ui.setting=el.dataset.s;
      if(NET.mode==='host'&&LS) LS.settingId=ui.setting;
      if(NET.mode==='host'&&LS) broadcast(); else render();
      break;
    }

    case 'addName':{
      if(ui.names.length<5){ ui.names.push(''); render(); }
      break;
    }

    case 'back':{
      ui.screen='mode'; render();
      break;
    }

    case 'startLocal':{
      if(!ui.names.length){ ui.names=['']; }
      const names=ui.names.map((n,i)=>(String(n).trim()||('Игрок '+(i+1))));
      const players=names.map((n,i)=>({id:'p'+i,name:n}));
      LS=createGame(ui.setting,players);
      sel=-1; readyKey='';
      render();
      break;
    }

    case 'startGame':{
      if(NET.mode!=='host'||!LS) break;
      LS=createGame(ui.setting,LS.players);
      sel=-1;
      broadcast();
      break;
    }

    case 'leaveRoom':{
      try{ if(NET.peer) NET.peer.destroy(); }catch(err){}
      NET.mode='local'; NET.peer=null; NET.conns=[]; NET.code=''; LS=null;
      ui.screen='mode';
      render();
      break;
    }

    case 'copyLink':{
      const url=location.origin+location.pathname+'?room='+NET.code;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(()=>toast('Ссылка скопирована'),()=>toast(url));
      }else{
        toast(url);
      }
      break;
    }

    case 'gate':{
      if(NET.mode==='local'&&LS){
        readyKey=LS.act+':'+LS.turn+':'+LS.openedThisAct;
        render();
      }
      break;
    }

    case 'pick':{
      const i=+el.dataset.i;
      const V=viewState();
      if(!V) break;
      const isLocal=NET.mode!=='guest';
      const cur=V.players[V.turn];
      if(!isLocal&&cur&&V.me!==cur.id){ toast('Сейчас ход другого игрока'); break; }
      sel=(sel===i)?-1:i;
      render();
      break;
    }

    case 'open':{
      if(sel<0){ toast('Выберите карту'); break; }
      const idx=sel; sel=-1;
      sendAction({type:'open',idx});
      break;
    }

    case 'discard':{
      if(sel<0){ toast('Выберите карту'); break; }
      const idx=sel; sel=-1;
      sendAction({type:'discard',idx});
      break;
    }

    case 'peek':{
      sendAction({type:'peek'});
      break;
    }

    case 'next':{
      sendAction({type:'next'});
      break;
    }

    case 'actend':{
      sendAction({type:'actend'});
      break;
    }

    case 'answer':{
      if(NET.mode==='guest'){ toast('Отвечает хост'); break; }
      sendAction({type:'answer',q:+el.dataset.q,v:+el.dataset.v});
      break;
    }

    case 'envelope':{
      if(NET.mode==='guest'){ toast('Конверт вскрывает хост'); break; }
      sendAction({type:'envelope'});
      break;
    }

    case 'newGame':{
      if(NET.mode==='host'&&LS){
        LS={phase:'lobby',settingId:LS.settingId,players:LS.players};
        broadcast();
      }else if(NET.mode==='local'){
        LS=null; sel=-1; readyKey='';
        ui.screen='setup';
        render();
      }else{
        toast('Ждём хоста…');
      }
      break;
    }
  }
});

/* ---------- 13. СТАРТ ---------- */

(function init(){
  if(pendingRoom){
    NET.mode='guest';
    render();
  }else{
    render();
  }
  window.addEventListener('beforeunload',()=>{
    try{ if(NET.peer) NET.peer.destroy(); }catch(e){}
  });
})();
</script>
</body>
</html>
